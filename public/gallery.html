<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery - Slice N Bites</title>
  <link rel="icon" type="image/png" href="images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    .gallery-hero{text-align:center;background:var(--color-hero-bg);border-radius:calc(var(--radius)*1.5);padding:clamp(36px,5vw,60px) var(--space-md);box-shadow:0 20px 45px rgba(95,42,2,.08);margin-bottom:var(--space-lg)}
    .gallery-hero h1{font-size:clamp(2rem,4vw,3rem);margin:12px 0 12px}
    .gallery-hero p{max-width:52ch;margin:0 auto;font-size:1.05rem}

    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-md)}
    .gallery-item{
      position:relative;
      aspect-ratio:4/5;
      border-radius:calc(var(--radius)*1.2);
      overflow:hidden;
      background:linear-gradient(135deg,var(--color-hero-bg),#f0a878);
      display:grid;place-items:center;
      box-shadow:0 18px 40px rgba(95,42,2,.06);
    }
    .gallery-item img{
      position:absolute;inset:0;
      width:100%;height:100%;
      object-fit:cover;display:block;
      transition:transform .4s ease;
    }
    .gallery-item:hover img{transform:scale(1.05)}
    .gallery-item .ph-icon{width:52px;height:52px;color:rgba(255,255,255,.85)}

    .gallery-item img { cursor: zoom-in; }

  .lightbox {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(41, 22, 10, .82);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .lightbox.is-open { display: flex; }
  .lightbox img {
    max-width: min(92vw, 900px); max-height: 88vh;
    border-radius: calc(var(--radius) * 1.2);
    box-shadow: 0 30px 60px rgba(0, 0, 0, .45);
  }
  .lightbox-close {
    position: absolute; top: 18px; right: 22px;
    width: 44px; height: 44px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255, 255, 255, .92); color: var(--color-heading);
    font-size: 1.5rem; line-height: 1; display: grid; place-items: center;
  }
  .lightbox-close:hover { background: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .lightbox.is-open { animation: lbfade .25s ease; }
    @keyframes lbfade { from { opacity: 0; } to { opacity: 1; } }
  }
  </style>
</head>
<body>

<header>
  <nav>
    <div class="logo"><img src="images/logo.png" alt="Slice N Bites"></div>
    <div>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<div class="container">

  <section class="gallery-hero">
    <span class="eyebrow reveal">Fresh from the oven</span>
    <h1 class="reveal d1">Gallery</h1>
    <p class="reveal d2">A little peek at what comes out of my kitchen. For custom orders, head to the <a href="contact.html">contact page</a>.</p>
  </section>

  <div class="gallery-grid">
    <div class="gallery-item">
      <img src="images/brownie-2.jpg" alt="Fudgy homemade brownie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/choc-chip-cookie.jpg" alt="Delicious Chocolate Chip Cookie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/fun-cookie.jpg" alt="A Funny Cookie with edible eyes" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/smores-cookie.jpg" alt="A S'mores cookie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/choc-cookie.jpg" alt="Delicious Chocolate Cookie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/sugar-cookie.jpg" alt="Delicious Sugar Cookie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/fun-cookie-2.jpg" alt="A different picture of a funny cookie" loading="lazy">
    </div>
    <div class="gallery-item">
      <img src="images/choc-chip-cookie-2.jpg" alt="Another Chocolate Chip Cookie" loading="lazy">
    </div>
  </div>

</div>

<!-- Lightbox overlay (shared by every photo) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<footer>
  <a class="social-link" href="https://www.facebook.com/share/1UZSywZuPF/?mibextid=wwXlfr" target="_blank" rel="noopener" aria-label="Slice N Bites on Facebook">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
    Find us on Facebook
  </a>
  © 2026 Slice N Bites — All Rights Reserved
</footer>

<script>
  const grid = document.querySelector(".gallery-grid");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const closeBtn = document.getElementById("lightbox-close");
  let lastFocused = null;

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt || "";
    lastFocused = document.activeElement;
    lightbox.classList.add("is-open");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove("is-open");
    lightboxImg.src = "";
    document.body.style.overflow = "";
    if (lastFocused) lastFocused.focus();
  }

  grid.addEventListener("click", (e) => {
    const img = e.target.closest("img");
    if (img) openLightbox(img.currentSrc || img.src, img.alt);
  });

  closeBtn.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
  });
</script>

</body>
</html>
