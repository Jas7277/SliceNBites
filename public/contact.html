<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slice N Bites</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav>
    <div class="logo"><img src="images/logo.png" alt="Slice N Bites"></div>
    <div>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<div class="container">
  <h1>Location & Contact</h1>

  <h2>Location</h2>
  <p><a href="https://maps.app.goo.gl/rdAnHm1tiYbVeD8KA">1 Youden Place, Brigus, NL A0A 1K0, Canada</a></p>

  <h2>Hours</h2>
  <p>24/7</p>

  <h2>Contact</h2>
  <p>Phone: +1 (709) 589-6192<br>Email: slicenbites@hotmail.com</p>

  <h2>Send me feedback!</h2>

  <div id="form-messages" aria-live="polite"></div>

  <form id="feedback-form">
    <input type="text" id="name" name="name" placeholder="Your Name" required><br><br>
    <input type="email" id="email" name="email" placeholder="Your Email" required><br><br>
    <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea><br><br>
    <button class="button" type="submit">Send</button>
  </form>
  <p id="form-status" role="status"></p>
</div>

<script>
  const contactForm = document.getElementById("feedback-form");
  const formStatus = document.getElementById("form-status");

  contactForm.addEventListener("submit", async (event) => {
    event.preventDefault();                  // stop the page reload
    formStatus.textContent = "Sending…";
    try {
      const response = await fetch("/api/feedback", {
        method: "POST",
        body: new FormData(contactForm),     // sends name, email, message
      });
      formStatus.textContent = await response.text();
      if (response.ok) contactForm.reset();
    } catch {
      formStatus.textContent = "Network error — please try again.";
    }
  });
</script>

<footer>
  © 2026 Slice N Bites — All Rights Reserved
</footer>

</body>
</html>
