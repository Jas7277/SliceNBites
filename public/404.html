<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found — Slice N Bites</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fffaf4;
        --card: #ffffff;
        --text: #4f2d18;
        --muted: #7d5945;
        --accent: #b85c2b;
        --accent-dark: #8d3f1b;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #fffaf4 0%, #ffe8d5 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(79, 45, 24, 0.12);
        padding: 40px;
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      h1 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 0 0 12px; }
      p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
      .primary {
        background: var(--accent);
        color: white;
      }
      .secondary {
        background: #f7eadf;
        color: var(--accent-dark);
      }
      a:hover { transform: translateY(-1px); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">404</div>
      <h1>That page wandered off.</h1>
      <p>The page you’re looking for doesn’t exist or may have moved. Head back home or visit the contact page if you were trying to reach us.</p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="/contact.html">Contact us</a>
      </div>
    </main>
  </body>
</html>
